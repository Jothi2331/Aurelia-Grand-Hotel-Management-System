<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Aurelia Grand{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--green:#10231b;--green2:#1b3529;--cream:#f6f1e8;--gold:#b88b57;--ink:#172019;--muted:#71776f;--white:#fff;--line:#ddd5c8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'DM Sans',sans-serif;background:#fbfaf7;color:var(--ink)}
h1,h2,h3,.serif{font-family:'Playfair Display',serif;font-weight:500}a{text-decoration:none;color:inherit}img{width:100%;display:block}button,input,select{font:inherit}.container{width:min(1180px,90%);margin:auto}
.topnav{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:25px 5%;color:#fff}.logo{font-family:'Playfair Display',serif;font-size:25px;letter-spacing:.1em}.logo small{display:block;font-family:'DM Sans';font-size:7px;letter-spacing:.27em;margin-top:4px;color:#dbc7ad}.navlinks{display:flex;gap:25px;align-items:center}.navlinks a{font-size:10px;letter-spacing:.1em;text-transform:uppercase}.nav-admin{border:1px solid rgba(255,255,255,.65);padding:11px 15px}.nav-book{background:var(--gold);padding:12px 17px}
.hero{height:100vh;min-height:700px;position:relative;background:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=2200&q=90') center/cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,15,10,.72),rgba(5,15,10,.15) 65%),linear-gradient(0deg,rgba(5,15,10,.45),transparent)}.hero-content{position:absolute;z-index:2;left:8%;bottom:17%;color:#fff;max-width:800px}.eyebrow{font-size:10px;letter-spacing:.23em;text-transform:uppercase;color:#d6b48d}.hero h1{font-size:clamp(60px,8vw,110px);line-height:.92;margin:18px 0 25px}.hero h1 em{color:#e0c6a9}.hero p{max-width:480px;line-height:1.8;color:#eee6db;font-size:14px}.hero-cta{display:inline-block;margin-top:18px;border-bottom:1px solid #fff;padding-bottom:5px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.booking-wrap{background:var(--green);padding:0 0 70px}.booking-box{transform:translateY(-35px);position:relative;z-index:4;background:var(--cream);padding:35px;display:grid;grid-template-columns:250px 1fr;gap:35px;align-items:end;box-shadow:0 20px 50px rgba(0,0,0,.15)}.booking-box h2{margin:8px 0;font-size:34px}.booking-form{display:grid;grid-template-columns:1fr 1fr .8fr auto}.booking-form label{padding:0 18px;border-left:1px solid #cfc5b8;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#756e65}.booking-form input,.booking-form select{width:100%;border:0;background:transparent;padding:12px 0 5px;outline:none;color:#222}.booking-form button{border:0;background:var(--green);color:#fff;padding:18px 22px;text-transform:uppercase;font-size:9px;letter-spacing:.12em}
.section{padding:110px 0}.intro-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:80px;align-items:center}.intro-grid img{height:650px;object-fit:cover}.intro h2,.section-head h2{font-size:clamp(48px,6vw,75px);line-height:1;margin:12px 0 25px}.intro .lead{font-family:'Playfair Display',serif;font-size:24px;line-height:1.5;color:#314137}.intro p{color:var(--muted);line-height:1.9;font-size:13px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:30px}.facts div{border-top:1px solid var(--line);padding-top:15px}.facts b{display:block;font-family:'Playfair Display';font-size:25px}.facts span{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#8a887f}
.dark{background:var(--green);color:#fff}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:50px}.section-head p{max-width:380px;color:#aab5ae;line-height:1.8;font-size:12px}.room-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:25px}.room-card{background:#173027;overflow:hidden}.room-card img{height:390px;object-fit:cover;transition:.5s}.room-card:hover img{transform:scale(1.03)}.room-content{padding:25px}.room-top{display:flex;justify-content:space-between;gap:20px}.room-content h3{font-size:32px;margin:8px 0}.room-content p{font-size:11px;line-height:1.7;color:#a8b4ad}.price{font-family:'Playfair Display';font-size:24px;white-space:nowrap}.price small{font-family:'DM Sans';font-size:8px;color:#9eaaa3}
.experience-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.exp-card{position:relative;height:520px;overflow:hidden}.exp-card img{height:100%;object-fit:cover}.exp-card:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,12,8,.8),transparent 60%)}.exp-copy{position:absolute;z-index:2;left:25px;right:25px;bottom:25px;color:#fff}.exp-copy span{font-size:8px;letter-spacing:.16em;color:#e0bd94}.exp-copy h3{font-size:34px;margin:8px 0}.exp-copy p{font-size:11px;line-height:1.6;color:#ddd}
.gallery-grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;grid-template-rows:300px 300px;gap:15px}.gallery-grid img{height:100%;object-fit:cover}.gallery-grid .big{grid-row:1/3}
.map-section{background:#eee8dd}.map-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:60px;align-items:center}.map-grid iframe{width:100%;height:530px;border:0}.map-grid h2{font-size:64px;line-height:1;margin:12px 0 25px}.map-grid p{color:var(--muted);line-height:1.8;font-size:13px}
.footer{background:#0a1510;color:#fff;padding:65px 0 25px}.footer-grid{display:grid;grid-template-columns:1.3fr .7fr .7fr 1fr;gap:40px}.footer h3{font-size:35px;margin:0}.footer p,.footer a{font-size:10px;color:#98a49d;line-height:1.8}.footer span{display:block;font-size:8px;letter-spacing:.14em;color:#b3926c;margin-bottom:12px}
.flash{background:#fff0e6;color:#8a5133;padding:12px;margin-bottom:15px}
.inner-head{background:var(--green);color:#fff;padding:100px 0 60px}.inner-head h1{font-size:60px;margin:10px 0}.inner-nav{background:var(--green);color:#fff;padding:20px 5%;display:flex;justify-content:space-between}.cards-list{padding:60px 0}.result{background:#fff;border:1px solid var(--line);display:grid;grid-template-columns:40% 60%;margin-bottom:25px}.result img{height:330px;object-fit:cover}.result-body{padding:30px;display:flex;justify-content:space-between;gap:25px}.result-body h2{font-size:38px;margin:8px 0}.result-body p{color:var(--muted);font-size:12px;line-height:1.7}.result-action{text-align:right;min-width:160px}.result-action strong{display:block;font-family:'Playfair Display';font-size:30px}.result-action button,.primary{border:0;background:var(--green);color:#fff;padding:14px 18px;margin-top:20px;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.booking-page{padding:60px 0}.booking-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px}.booking-summary{background:var(--green);color:#fff}.booking-summary img{height:330px;object-fit:cover}.booking-summary .pad{padding:30px}.booking-summary h1{font-size:45px;margin:8px 0}.booking-summary p{color:#aeb8b1;font-size:12px;line-height:1.8}.guest-form h2{font-size:50px}.guest-form label{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-top:18px}.guest-form input{width:100%;border:0;border-bottom:1px solid #bbb;padding:12px 0;background:transparent;outline:none}
.success{min-height:100vh;display:grid;place-items:center;background:var(--green);padding:30px}.success-card{background:#fff;padding:50px;max-width:700px;width:100%}.success-card h1{font-size:55px}.success-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:30px 0}.success-grid div{padding:15px 0;border-bottom:1px solid var(--line)}.success-grid span{display:block;font-size:8px;color:#888;text-transform:uppercase}.success-grid b{font-size:11px}
.login-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login-photo{background:url('https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1500&q=90') center/cover}.login-panel{display:flex;align-items:center;padding:8vw}.login-box{width:100%;max-width:420px}.login-box h1{font-size:60px}.login-box label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-top:20px}.login-box input{width:100%;border:0;border-bottom:1px solid #aaa;padding:12px 0;outline:none}.login-box button{width:100%;border:0;background:var(--green);color:#fff;padding:16px;margin-top:25px}.error{background:#f4dddd;color:#8a4039;padding:10px}
.admin{min-height:100vh;background:#f2f0ea;display:grid;grid-template-columns:230px 1fr}.sidebar{background:var(--green);color:#fff;padding:30px;display:flex;flex-direction:column}.sidebar h2{font-size:28px}.sidebar nav{margin-top:45px}.sidebar nav a{display:block;padding:14px 0;border-bottom:1px solid #365145;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#bbc7c0}.sidebar .bottom{margin-top:auto}.admin-main{padding:50px}.admin-main h1{font-size:55px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:35px 0}.stat{background:#fff;padding:23px}.stat span{font-size:8px;color:#888;text-transform:uppercase}.stat strong{display:block;font-family:'Playfair Display';font-size:42px;margin-top:8px}.panel{background:#fff;padding:25px;margin-top:20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{text-align:left;border-bottom:1px solid #eee;padding:13px 8px;font-size:10px}th{font-size:8px;text-transform:uppercase;color:#888}.status{padding:6px 8px;background:#eceae4;font-size:8px}.room-admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.room-admin{background:#fff}.room-admin img{height:240px;object-fit:cover}.room-admin .pad{padding:20px}.room-admin select,.room-admin button{padding:9px;margin-top:12px}
.actions{display:flex;gap:6px}.actions button{border:0;padding:7px 9px;font-size:8px;color:#fff}.good{background:#315f49}.bad{background:#9b564a}
@media(max-width:900px){.navlinks{display:none}.booking-box{grid-template-columns:1fr}.booking-form{grid-template-columns:1fr 1fr}.intro-grid,.map-grid,.booking-grid,.login-page{grid-template-columns:1fr}.room-grid,.experience-grid{grid-template-columns:1fr}.gallery-grid{display:block}.gallery-grid img{height:320px;margin-bottom:12px}.footer-grid{grid-template-columns:1fr 1fr}.admin{display:block}.sidebar{min-height:auto}.stats{grid-template-columns:1fr 1fr}.room-admin-grid{grid-template-columns:1fr}.result{grid-template-columns:1fr}.result-body{display:block}.result-action{text-align:left}}
@media(max-width:600px){.hero h1{font-size:54px}.booking-form{grid-template-columns:1fr}.section{padding:75px 0}.intro-grid img{height:420px}.section-head{display:block}.facts{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.admin-main{padding:25px}.success-grid{grid-template-columns:1fr}}

/* Readability update */
body{font-size:16px}
.logo{font-size:30px}.logo small{font-size:9px}.navlinks a{font-size:12px}.nav-admin,.nav-book{font-size:11px!important}
.eyebrow{font-size:12px}.hero p{font-size:17px}.hero-cta{font-size:12px}
.booking-box h2{font-size:40px}.booking-form label{font-size:11px}.booking-form input,.booking-form select{font-size:15px}.booking-form button{font-size:11px}
.intro .lead{font-size:28px}.intro p{font-size:15px}.facts b{font-size:30px}.facts span{font-size:10px}.section-head p{font-size:15px}
.room-content h3{font-size:36px}.room-content p{font-size:14px}.price{font-size:30px}.price small{font-size:10px}
.exp-copy span{font-size:10px}.exp-copy h3{font-size:38px}.exp-copy p{font-size:14px}.map-grid p{font-size:15px}
.footer h3{font-size:40px}.footer p,.footer a{font-size:12px}.footer span{font-size:10px}
.inner-head p{font-size:14px}.result-body p{font-size:14px}.result-body small,.result-action small{font-size:10px}.result-action button{font-size:11px}
.booking-summary p{font-size:14px}.guest-form label{font-size:11px}.guest-form input{font-size:15px}.primary{font-size:11px}
.success-card p{font-size:14px}.success-grid span{font-size:10px}.success-grid b{font-size:13px}
.login-box p{font-size:14px}.login-box label{font-size:11px}.login-box input{font-size:15px}.login-box button{font-size:11px}
.sidebar small{font-size:10px}.sidebar nav a{font-size:12px}.sidebar .bottom a{font-size:11px}.admin-main>p{font-size:14px}.stat span{font-size:10px}.stat strong{font-size:46px}
th{font-size:10px}td{font-size:12px}.status{font-size:9px}.room-admin .pad p{font-size:13px}.room-admin .pad b{font-size:14px}.room-admin select,.room-admin button{font-size:11px}.actions button{font-size:10px}
@media(max-width:600px){body{font-size:15px}.hero p{font-size:15px}.booking-form label{font-size:10px}.booking-form input,.booking-form select{font-size:14px}.intro p{font-size:14px}.room-content p{font-size:13px}.exp-copy p{font-size:13px}.footer p,.footer a{font-size:11px}td{font-size:11px}th{font-size:9px}}

/* ---------- AURELIA CHATBOT ---------- */
.chat-launcher{
    position:fixed;right:24px;bottom:24px;z-index:1000;
    width:60px;height:60px;border:0;border-radius:50%;
    background:var(--gold);color:#10231b;font-size:25px;cursor:pointer;
    box-shadow:0 12px 35px rgba(0,0,0,.25)
}
.chat-widget{
    position:fixed;right:24px;bottom:96px;z-index:1000;
    width:min(380px,calc(100vw - 30px));height:520px;
    background:#fff;border:1px solid var(--line);
    box-shadow:0 20px 55px rgba(0,0,0,.25);
    display:none;flex-direction:column;overflow:hidden
}
.chat-widget.open{display:flex}
.chat-head{background:var(--green);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.chat-head strong{font-family:'Playfair Display';font-size:22px;font-weight:500}
.chat-head span{display:block;font-size:9px;color:#b9c5be;letter-spacing:.08em;margin-top:3px}
.chat-close{border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer}
.chat-body{flex:1;padding:18px;overflow:auto;background:#f7f4ee}
.chat-msg{max-width:82%;padding:11px 13px;margin-bottom:10px;font-size:12px;line-height:1.55}
.chat-msg.bot{background:#fff;border:1px solid #e3ddd2}
.chat-msg.user{background:var(--green);color:#fff;margin-left:auto}
.chat-input{display:flex;border-top:1px solid #e5dfd5;background:#fff}
.chat-input input{flex:1;border:0;padding:15px;outline:none;font-size:13px}
.chat-input button{border:0;background:var(--gold);padding:0 18px;cursor:pointer;font-weight:600}
@media(max-width:600px){
    .chat-launcher{right:16px;bottom:16px}
    .chat-widget{right:15px;bottom:88px;height:470px}
}

</style>
</head>
<body>
{% block body %}{% endblock %}

<button class="chat-launcher" id="chatLauncher" aria-label="Open hotel chatbot">✦</button>

<div class="chat-widget" id="chatWidget">
    <div class="chat-head">
        <div><strong>Aurelia Concierge</strong><span>ROOMS · BOOKING · PAYMENT · HOTEL INFO</span></div>
        <button class="chat-close" id="chatClose" type="button">×</button>
    </div>
    <div class="chat-body" id="chatBody">
        <div class="chat-msg bot">Welcome to Aurelia Grand. Ask me about rooms, booking, Google Pay, dining, spa, check-in or location.</div>
    </div>
    <form class="chat-input" id="chatForm">
        <input id="chatMessage" autocomplete="off" placeholder="Ask your question..." required>
        <button type="submit">Send</button>
    </form>
</div>

<script>
const chatLauncher = document.getElementById("chatLauncher");
const chatWidget = document.getElementById("chatWidget");
const chatClose = document.getElementById("chatClose");
const chatForm = document.getElementById("chatForm");
const chatMessage = document.getElementById("chatMessage");
const chatBody = document.getElementById("chatBody");

function addChatMessage(text, type){
    const el = document.createElement("div");
    el.className = "chat-msg " + type;
    el.textContent = text;
    chatBody.appendChild(el);
    chatBody.scrollTop = chatBody.scrollHeight;
}
chatLauncher.addEventListener("click", () => {
    chatWidget.classList.toggle("open");
    if(chatWidget.classList.contains("open")) chatMessage.focus();
});
chatClose.addEventListener("click", () => chatWidget.classList.remove("open"));

chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = chatMessage.value.trim();
    if(!text) return;
    addChatMessage(text, "user");
    chatMessage.value = "";
    try{
        const res = await fetch("/chat", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:text})
        });
        const data = await res.json();
        addChatMessage(data.reply || "Sorry, I could not answer that.", "bot");
    }catch(err){
        addChatMessage("Chat service is temporarily unavailable.", "bot");
    }
});
</script>

</body>
</html>
